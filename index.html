<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Paperly</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>

  <!-- Защита глаз -->
  <div id="warm-overlay"></div>
  <button id="warm-toggle-btn">🕯️ Защита глаз</button>

  <!-- Всплывающая табличка при входе -->
  <div id="modal-backdrop" onclick="handleBackdropClick(event)">
    <div class="modal-card">
      <h3>Защита глаз 🕯️</h3>
      <p>Включить мягкий тёплый свет? Он убирает синее излучение, чтобы глаза отдыхали и не уставали при чтении.</p>
      <div class="modal-btns">
        <button class="btn-warm" id="btn-turn-on" onclick="handleWarmOn()">Включить</button>
        <button class="btn-cancel" id="btn-turn-off" onclick="closeModal()">Не сейчас</button>
      </div>
    </div>
  </div>

  <!-- Индикатор загрузки -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-status" style="font-size: 18px; color: #f1dfc5; margin-bottom: 8px;">Скачиваем книгу...</div>
    <div style="font-size: 13px; color: #8f7e70;">Нарезаем страницы в 3D разворот</div>
  </div>

  <!-- 1. ЭКРАН КАТАЛОГА -->
  <div id="catalog-view">
    <h1 class="catalog-title">ОНЛАЙН БИБЛИОТЕКА</h1>
    <div class="catalog-subtitle">Прямой доступ к официальным фондам мировой классики (Викитека):</div>

    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Поиск автора или книги (Шерлок Холмс, Достоевский, Лавкрафт)...">
      <button class="btn-search" id="btn-search">Найти</button>
    </div>

    <!-- ОФИЦИАЛЬНЫЕ КАТЕГОРИИ ВИКИТЕКИ -->
    <div class="filters-bar" id="filters-bar">
      <button class="filter-btn active" data-category="Категория:Фантастика">🚀 Фантастика</button>
      <button class="filter-btn" data-category="Категория:Приключенческая литература">🧭 Приключения</button>
      <button class="filter-btn" data-category="Категория:Сказки">🧚 Сказки</button>
      <button class="filter-btn" data-category="Категория:Повести">🎭 Повести и классика</button>
      <button class="filter-btn" data-category="Категория:Философия">📜 Философия</button>
      <button class="filter-btn" data-category="Категория:Романы">📚 Романы</button>
    </div>

    <div class="books-grid" id="books-grid"></div>
  </div>

  <!-- 2. ЭКРАН ЧИТАЛКИ -->
  <div id="reader-view">
    <button id="back-to-catalog-btn">← В каталог</button>
    <div id="book-wrapper"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="script.js?v=10"></script>
</body>
</html>
